# GitHub 에 올리기만 하면 자동으로 jar 를 빌드해줍니다.
# (내 컴퓨터에 JDK/Maven 설치 필요 없음)
#
# 사용법:
#   1) github.com 에서 새 저장소를 만들고 이 폴더 전체를 업로드
#   2) 저장소 상단 Actions 탭 -> 실행 중인 작업 클릭
#   3) 2~3분 뒤 Artifacts 의 "RpgCore-plugin-jar" 다운로드 -> 압축 풀면 rpg-core-plugin.jar
#   4) 서버 plugins/ 폴더에 넣고 재시작
name: Build plugin jar

on:
  push:
  workflow_dispatch:   # Actions 탭에서 수동 실행도 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 빌드 (mvn package)
        run: mvn -B package --file pom.xml

      - name: 빌드 결과 확인
        run: ls -lh target/*.jar

      - name: jar 업로드
        uses: actions/upload-artifact@v4
        with:
          name: RpgCore-plugin-jar
          path: target/*.jar
          if-no-files-found: error
