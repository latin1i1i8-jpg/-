# ⭐ 처음 접속 플레이어 스폰 위치 (마을)
spawn:
  world: planet_terra
  x: 0.5
  y: 65
  z: 0.5
  yaw: 0
  pitch: 0

# ============================================================
# RpgCore 설정
# ============================================================
# 이 파일만 고치면 재컴파일 없이 대부분을 바꿀 수 있습니다.
#  1) planets     : 행성(차원) 목록
#  2) mob-stats   : ⭐ 바닐라 몬스터의 체력/공격력 직접 지정
#  3) tower       : ⭐ 시련의 탑
#  4) bedrock     : ⭐ 베드락(Geyser) 호환 옵션
# ============================================================

# ------------------------------------------------------------
# 1) 행성 = 독립된 차원(월드)
# ------------------------------------------------------------
# 서버를 처음 켜면 아래 world 이름으로 월드가 자동 생성됩니다.
# "지도"를 직접 만들고 싶으면:
#   1) 미리 만들어둔 맵 폴더를 서버 루트에 world 이름과 같게 넣거나
#   2) 자동 생성된 월드에 들어가 직접 지형/건축을 꾸미면 됩니다.
#
# mobs 는 전부 바닐라 마인크래프트 몬스터입니다. (커스텀 몹 아님)
# 체력/공격력만 아래 mob-stats + 행성 mult + 단계로 바뀝니다.
#
# mult: 행성 배수 (체력/공격력/보상 스케일)
# level-requirement: 이동에 필요한 최소 레벨
# travel-cost: 이동 골드 비용
# environment: NORMAL / NETHER / THE_END
# mobs: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/entity/EntityType.html
# ------------------------------------------------------------
planets:
  terra:
    name: "테라"
    world: "planet_terra"
    environment: NORMAL
    mult: 1.0
    level-requirement: 0
    travel-cost: 0
    mobs:
      - ZOMBIE
      - SKELETON
      - SPIDER
  ignis:
    name: "이그니스"
    world: "planet_ignis"
    environment: NETHER
    mult: 3.5
    level-requirement: 10
    travel-cost: 50000
    mobs:
      - BLAZE
      - MAGMA_CUBE
      - ZOMBIFIED_PIGLIN
  glacies:
    name: "글라키에스"
    world: "planet_glacies"
    environment: NORMAL
    mult: 9.0
    level-requirement: 20
    travel-cost: 200000
    mobs:
      - STRAY
      - DROWNED
      - CAVE_SPIDER
  voltus:
    name: "볼투스"
    world: "planet_voltus"
    environment: NORMAL
    mult: 22.0
    level-requirement: 30
    travel-cost: 800000
    mobs:
      - CREEPER
      - PHANTOM
      - WITCH
  umbra:
    name: "움브라"
    world: "planet_umbra"
    environment: THE_END
    mult: 55.0
    level-requirement: 40
    travel-cost: 3000000
    mobs:
      - ENDERMAN
      - PHANTOM
      - WITHER_SKELETON
  finale:
    name: "종언"
    world: "planet_finale"
    environment: NORMAL
    mult: 400.0
    level-requirement: 50
    travel-cost: 30000000
    mobs:
      - WITHER_SKELETON
      - EVOKER
      - VINDICATOR
      - RAVAGER

# ------------------------------------------------------------
# 2) ⭐ 몬스터 스탯 — 바닐라 몹의 체력/공격력을 직접 바꿉니다
# ------------------------------------------------------------
# 계산식:
#   최종 체력   = base.<몹>.health * (1 + ln(행성mult) * planet-health-weight) * (1 + (단계-1) * health-per-stage)
#   최종 공격력 = base.<몹>.damage * (1 + ln(행성mult) * planet-damage-weight) * (1 + (단계-1) * damage-per-stage)
# 그리고 health-cap / damage-cap 으로 최대치를 자릅니다.
#
# ⭐ base 에 적은 값이 "테라(mult 1.0) 1단계" 기준이며, 그 상황에서는 배율이 정확히 1.0 입니다.
#   즉 아래 ZOMBIE health 20 / damage 3 은 바닐라 좀비와 똑같다는 뜻이고,
#   숫자를 40 / 6 으로 고치면 모든 좀비가 체력 2배 · 공격력 2배가 됩니다.
# 목록에 없는 몹은 바닐라 기본값을 그대로 base 로 씁니다.
#
# ※ 크리퍼 폭발 / 블레이즈·가스트 화염구 / 스켈레톤 화살 / 마녀 물약처럼
#   근접 공격이 아닌 피해는 마인크래프트 속성으로 조절이 안 됩니다.
#   그래서 이 플러그인은 "배율"을 따로 계산해 실제 피해에 곱해줍니다. (자동 처리)
# ------------------------------------------------------------
mob-stats:
  health-cap: 2000.0       # 몬스터 체력 상한 (너무 높이면 전투가 지루해집니다)
  damage-cap: 24.0         # 몬스터 공격력 상한 (플레이어가 한 방에 죽지 않게)
  health-per-stage: 0.30   # 단계당 체력 증가율 (+30%p)
  damage-per-stage: 0.06   # 단계당 공격력 증가율 (+6%p)
  planet-health-weight: 1.2
  planet-damage-weight: 0.5
  base:
    ZOMBIE:            { health: 20.0, damage: 3.0 }
    HUSK:              { health: 20.0, damage: 3.0 }
    DROWNED:           { health: 20.0, damage: 3.0 }
    SKELETON:          { health: 20.0, damage: 4.0 }
    STRAY:             { health: 20.0, damage: 4.0 }
    WITHER_SKELETON:   { health: 20.0, damage: 8.0 }
    SPIDER:            { health: 16.0, damage: 3.0 }
    CAVE_SPIDER:       { health: 12.0, damage: 2.0 }
    CREEPER:           { health: 20.0, damage: 22.0 }
    PHANTOM:           { health: 20.0, damage: 4.0 }
    WITCH:             { health: 26.0, damage: 6.0 }
    BLAZE:             { health: 20.0, damage: 6.0 }
    MAGMA_CUBE:        { health: 16.0, damage: 4.0 }
    ZOMBIFIED_PIGLIN:  { health: 20.0, damage: 5.0 }
    PIGLIN_BRUTE:      { health: 50.0, damage: 13.0 }
    ENDERMAN:          { health: 40.0, damage: 7.0 }
    EVOKER:            { health: 24.0, damage: 6.0 }
    VINDICATOR:        { health: 24.0, damage: 13.0 }
    RAVAGER:           { health: 100.0, damage: 12.0 }
    PILLAGER:          { health: 24.0, damage: 5.0 }
    SLIME:             { health: 16.0, damage: 4.0 }
    SILVERFISH:        { health: 8.0,  damage: 1.0 }
    GHAST:             { health: 10.0, damage: 6.0 }
    HOGLIN:            { health: 40.0, damage: 6.0 }
    GUARDIAN:          { health: 30.0, damage: 6.0 }
    ELDER_GUARDIAN:    { health: 80.0, damage: 8.0 }

# ------------------------------------------------------------
# 3) ⭐ 시련의 탑 — 돌로 쌓은 탑, 한 층에 몬스터 1마리
# ------------------------------------------------------------
# 규칙:
#   - 1층부터 시작해서 한 층에 몬스터가 딱 1마리만 나옵니다
#   - 그 1마리를 잡으면 천장의 돌 뚜껑이 열리고 사다리로 위층에 올라갑니다
#   - 위층으로 갈수록 몬스터가 강해집니다 (층 = 단계)
#   - boss-every 층마다 보스급(더 강한 1마리)이 나옵니다
#   - 죽거나 나가면 그 회차는 초기화되어 다시 1층부터 (최고 기록은 저장)
#
# 탑은 전용 빈 월드에 플레이어별로 따로 지어집니다 (서로 방해 없음).
# ------------------------------------------------------------
tower:
  world: "trial_tower"     # 탑 전용 월드 이름 (빈 공간으로 자동 생성)
  floors: 50               # 총 층 수
  room-size: 9             # 한 층 내부 크기 (9 = 9x9 방)
  base-mult: 1.0           # 탑 몬스터 기본 배수
  mult-per-floor: 0.25     # 층당 배수 증가 (1층=1.25, 20층=6.0, 50층=13.5)
  boss-every: 10           # 이 층마다 보스급 1마리 (0 = 보스 없음)
  boss-health-mult: 2.5    # 보스 체력 배율 (상한도 같은 비율로 올라갑니다)
  boss-damage-mult: 1.0    # 보스 공격력 배율 (1.0 = 즉사 방지, 대신 체력만 두껍게)
  reward-mult: 1.5         # 탑 처치 보상 배수 (행성보다 후하게)
  protect-blocks: true     # 탑 안에서 블록 파괴/설치 금지 (관리자는 예외)
  wall-block: STONE                # 벽 재질 (돌)
  floor-block: STONE_BRICKS        # 바닥/천장 재질
  gate-block: STONE                # 천장 뚜껑 재질 (몬스터 잡으면 열림)
  light-block: GLOWSTONE           # 조명 (탑 안은 자연 스폰 없음)
  mobs:                    # 층마다 이 목록에서 1마리 랜덤 (전부 바닐라 몹)
    - ZOMBIE
    - SKELETON
    - SPIDER
    - HUSK
    - STRAY
    - CAVE_SPIDER
    - ZOMBIFIED_PIGLIN
    - BLAZE
    - MAGMA_CUBE
    - WITHER_SKELETON
    - VINDICATOR
    - PILLAGER
    - PIGLIN_BRUTE
  boss-mobs:               # 보스 층 전용 (한 마리만 나옵니다)
    - RAVAGER
    - EVOKER
    - ELDER_GUARDIAN
    - PIGLIN_BRUTE

# ------------------------------------------------------------
# 4) ⭐ 베드락 에디션 호환 (Geyser + Floodgate)
# ------------------------------------------------------------
# 베드락(휴대폰/콘솔/윈도우10) 플레이어가 같은 서버에 접속하게 하려면
# 서버에 Geyser-Spigot + Floodgate 플러그인을 넣으면 됩니다. (README 참고)
# 아래 옵션은 그 베드락 플레이어에게만 적용됩니다.
# ------------------------------------------------------------
bedrock:
  strip-emoji: true        # 베드락에서 깨져 보이는 이모지/기호를 자동 제거
  welcome-hint: true       # 접속 시 영문 명령어(/job, /warp …) 안내 표시
